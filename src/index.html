<!doctype html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef0f7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="山团团">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>山团团 · 本地离线版</title>
  <link rel="stylesheet" href="%BASE_URL%stage.css">
  <link rel="stylesheet" href="%BASE_URL%index.css">
  <script src="%BASE_URL%stage.js"></script>
</head>
<body class="offline-home stage-root" x-data="offlineLanding" @keydown.escape.window="closeInfo()">
  <main class="offline-landing">
    <div class="offline-entry">
      <button class="info-button" type="button" @click="toggleInfo()">
        <span class="info-button-mark" aria-hidden="true">?</span>
        <span>活动说明</span>
      </button>
      <a class="play-link" href="%BASE_URL%play/">
        <span class="play-link-track" aria-hidden="true"></span>
        <span class="play-link-label">前往</span>
        <svg class="play-link-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="12" />
          <path d="M6.7 11.2a5.4 5.4 0 0 1 9.1-3.4" />
          <path d="M17.3 12.8a5.4 5.4 0 0 1-9.1 3.4" />
          <path class="play-link-icon-head" d="M17.6 5.4 17.9 10l-4.4-1.2Z" />
          <path class="play-link-icon-head" d="M6.4 18.6 6.1 14l4.4 1.2Z" />
        </svg>
      </a>
    </div>
    <div class="offline-info-modal" x-show="infoOpen" x-cloak @click.self="closeInfo()" role="presentation">
      <section class="offline-info-dialog" role="dialog" aria-modal="true" aria-labelledby="offline-info-title">
        <button class="offline-info-close" type="button" @click="closeInfo()" aria-label="关闭说明">×</button>
        <h1 id="offline-info-title">活动说明</h1>
        <p>《明日方舟：终末地》「融合！山团团！」网页活动资源提取。这是社区整理，角色、图像、音乐、字体、标识和原版代码的权利归鹰角网络所有。</p>
        <p>本项目整理自 <a class="notice-link" href="https://space.bilibili.com/51211646">Crowning洛凡</a> 的<a class="notice-link" href="https://www.bilibili.com/video/BV1ByH86gEXZ/">分享</a>。基于原始的材料，做了一些优化。本仓库已对资源进行归档，官方活动下线后也能照常游玩。</p>
        <p>本项目不是官方产品，不涉及话题活动和盈利，不收费、不发官方奖励、不把成绩提交给官方。</p>
        <p>原生素材的权利不因免费提供或转载许可而转移。请勿以本站牟利、转售或冒充官方。</p>
        <p>页面按现状提供。存档只在当前浏览器，换浏览器、清理站点数据或更换地址可能导致记录无法读取。分数和图鉴保存在当前浏览器，F10 可导出或导入存档。</p>
      </section>
    </div>
  </main>
  <script type="module" src="./offline/index.js"></script>
</body>
</html>
